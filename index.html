<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <div class="head">
        <h1 id="headline">Change Text Color</h1>
      </div>
      <div class="btn-box">
        <button class="red-btn btn">Red</button>
        <button class="blue-btn btn">Blue</button>
        <button class="green-btn btn">Green</button>
      </div>
    </div>

    <div class="profile">
      <button class="profile-btn" id="toggleBtn">Open Profile</button>

      <div class="profile-card hidden">
        <h3>სახელი: ემზარი</h3>
        <p>ასაკი: 25</p>
        <p>ჰობი: ჭამა-სმა</p>
      </div>
    </div>

    <div class="symbols">
      <h3>სიმბოლოების დათვლა</h3>
      <textarea id="text-area" placeholder="ჩაწერეთ ტექსტი..."></textarea>
      <div id="counter">სიმბოლოების რაოდენობა: 0</div>
    </div>

    <div class="photos">
      <img src="img/img.jpg" alt="main-photo" width="300" id="mainImage" />
      <div class="photo-click">
        <button id="btn1">
          <img src="img/img.jpg" alt="click" width="70" class="change-img" />
        </button>
        <button id="btn2">
          <img src="img/img2.jpg" alt="click" width="70" class="change-img" />
        </button>
        <button id="btn3">
          <img src="img/pic1.jpg" alt="click" width="70" class="change-img" />
        </button>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
